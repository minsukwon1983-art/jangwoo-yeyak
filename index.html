<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>장우 예약</title>
<meta name="apple-mobile-web-app-title" content="장우 예약">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f1e8">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="mic-180.png">
<link rel="icon" sizes="192x192" href="mic-192.png">
<link rel="icon" sizes="512x512" href="mic-512.png">
<!--
  장우가든 [장우 예약] 버튼 (아이폰·갤럭시 공용, 홈 화면 아이콘은 마이크 — 장우가든 로고는 자리 배치 앱이 이미 씀)
  링크: https://minsukwon1983-art.github.io/jangwoo-yeyak/?k=열쇠&w=이름
  열쇠는 이 파일에 넣지 않는다. 링크에만 있다.
  보내는 곳: Apps Script 웹 앱 doPost (요청함.gs) → 노션 "자비스 요청함"
-->
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f6f1e8;color:#2b2118;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.w{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top img{width:56px;height:56px;border-radius:14px}
h1{font-size:28px;margin:0;color:#7a2e1b}.who{font-size:16px;color:#6b5a48}
textarea{width:100%;height:40vh;min-height:200px;font-size:20px;line-height:1.5;padding:14px;border:2px solid #c9b79c;border-radius:14px;background:#fff;color:#2b2118;-webkit-appearance:none}
button{width:100%;font-size:24px;font-weight:700;padding:18px;border:0;border-radius:14px;background:#7a2e1b;color:#fff;margin-top:12px;-webkit-appearance:none}
button:disabled{opacity:.5}
button.paste{background:#fff;color:#7a2e1b;border:2px solid #7a2e1b;margin:0 0 12px;font-size:21px;padding:16px}
.msg{font-size:20px;margin-top:14px;white-space:pre-line;min-height:1.5em}
.ex{font-size:16px;color:#6b5a48;margin-top:18px;line-height:1.7;background:#fffaf2;border-radius:12px;padding:12px 14px}
.ex b{color:#2b2118}
.bad{font-size:20px;padding:24px;line-height:1.6}
</style>
</head>
<body>
<div class="w" id="app">
  <div class="top"><img src="mic-180.png" alt="장우 예약">
    <div><h1>장우 예약</h1><div class="who" id="who">자비스에게 보내기</div></div></div>
  <button id="ph" class="paste">📷 캡처 사진으로 보내기</button>
  <input id="f" type="file" accept="image/*" multiple hidden>
  <button id="p" class="paste">📋 복사한 글 붙여넣고 보내기</button>
  <textarea id="t" placeholder="여기를 누르고, 키보드의 🎤 마이크를 눌러 말하거나 붙여넣기 하세요"></textarea>
  <button id="b">보내기</button>
  <div class="msg" id="m"></div>
  <div class="ex"><b>이렇게 보내세요</b><br>
  · 새 예약: "26일 저녁 7시 김철수 6명 공일공 1234 5678"<br>
  · 룸 바꾸기: "25일 김철수님 5번룸으로 바꿔 줘"<br>
  · 시간·인원: "25일 김철수님 8명, 7시로"<br>
  · 취소: "25일 김철수님 취소"<br>
  · 에이닷 통화 내용: 화면 <b>캡처</b> → 위 <b>📷 버튼</b> → 캡처 고르기 (여러 장 가능)<br>
  · 복사한 글이 있으면: 위 <b>📋 버튼</b> 한 번<br>
  · 예약 현황: "오늘 예약 현황 보내 줘"<br>
  → 보내면 자비스가 <b>바로</b> 장부에 넣고 4명에게 카톡을 보냅니다. 결과는 보내기 버튼 아래에 떠요.</div>
</div>
<script>
var URL_ = "https://script.google.com/macros/s/AKfycbwPOkSzu48JYIuWm_2B0cKNOdfr_rwQ3VTt1shG05Ew1wMB92dqQj2maYzbq36Mw0-_/exec";
var q = new URLSearchParams(location.search), K = q.get("k") || "", W = q.get("w") || "";
// 홈 화면에서 열 때 주소 뒷부분이 빠지는 경우를 대비해 이 휴대폰에 기억해 둔다
try { if (K) { localStorage.setItem("jw_k", K); localStorage.setItem("jw_w", W); } else { K = localStorage.getItem("jw_k") || ""; W = localStorage.getItem("jw_w") || ""; } } catch (e) {}
if (!K) {
  document.getElementById("app").innerHTML = '<div class="bad">링크가 맞지 않아요.<br>자비스에게 받은 본인 링크로 다시 열어 주세요.</div>';
} else {
  if (W) document.getElementById("who").textContent = W + "님 · 자비스에게 보내기";
  var t = document.getElementById("t"), b = document.getElementById("b"), p = document.getElementById("p"), m = document.getElementById("m");
  var ph = document.getElementById("ph"), f = document.getElementById("f");
  function busy(on) { b.disabled = p.disabled = ph.disabled = on; b.textContent = on ? "보내는 중…" : "보내기"; }
  function send(images) {
    images = images || [];
    if (!t.value.trim() && !images.length) { m.textContent = "보낼 내용을 먼저 써 주세요."; return; }
    busy(true); m.textContent = "자비스가 읽고 있어요… (" + (images.length ? "20~30초" : "10초쯤") + ")";
    fetch(URL_, { method: "POST", body: JSON.stringify({ key: K, who: W, text: t.value, images: images }) })
      .then(function (r) { return r.text(); })
      .then(function (r) { m.textContent = r; if (r.indexOf("✅") === 0 || r.indexOf("📋") === 0) t.value = ""; })
      .catch(function () { m.textContent = "❌ 못 보냈어요. 인터넷을 확인하고 다시 눌러 주세요."; })
      .then(function () { busy(false); });
  }
  // 📷 캡처 사진: 휴대폰에서 줄여서(긴 쪽 1600px, JPEG) 보낸다
  function shrink(file) {
    return new Promise(function (ok, no) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1600 / Math.max(img.width, img.height));
        var c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        ok(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
      };
      img.onerror = function () { no(); }; img.src = url;
    });
  }
  ph.onclick = function () { f.value = ""; f.click(); };
  f.onchange = function () {
    var files = Array.prototype.slice.call(f.files || [], 0, 4);
    if (!files.length) return;
    m.textContent = "사진 " + files.length + "장 준비 중…";
    Promise.all(files.map(shrink)).then(send).catch(function () { m.textContent = "❌ 사진을 못 읽었어요. 다시 골라 주세요."; });
  };
  b.onclick = function () { send(); };
  // 📋 복사해 둔 글(에이닷 요약 등)을 붙여넣고 바로 보내기. 아이폰은 처음에 "붙여넣기" 허락 말풍선이 뜰 수 있음
  p.onclick = function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      m.textContent = "이 휴대폰에서는 버튼으로 붙여넣기가 안 돼요. 글 칸을 꾹 눌러 붙여넣기 해 주세요."; t.focus(); return;
    }
    navigator.clipboard.readText().then(function (s) {
      if (!s || !s.trim()) { m.textContent = "복사된 글이 없어요. 에이닷 요약을 먼저 복사해 주세요."; return; }
      t.value = s.trim(); send([]);
    }).catch(function () {
      m.textContent = "붙여넣기를 허락해 주세요. 안 되면 글 칸을 꾹 눌러 붙여넣기 해 주세요."; t.focus();
    });
  };
}
</script>
</body>
</html>
