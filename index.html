<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>자비스</title>
<meta name="apple-mobile-web-app-title" content="자비스">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121212">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="mic-180.png">
<link rel="icon" sizes="192x192" href="mic-192.png">
<link rel="icon" sizes="512x512" href="mic-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>html,body{margin:0;background:#121212}</style>
</head>
<body>
<!-- 🔄 2026-11-18: 아이폰 홈 화면 앱이 예전 화면을 오래 기억해서, 이 껍데기가 늘 최신 app.html 을 받아 와 그린다. 화면 내용은 app.html 을 고친다 -->
<script>
fetch("app.html?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); })
  .then(function (h) { document.open(); document.write(h); document.close(); })
  .catch(function () { document.body.innerHTML = '<p style="color:#eee;font:18px sans-serif;padding:30px">인터넷 연결을 확인하고 다시 열어 주세요.</p>'; });
</script>
</body>
</html>
